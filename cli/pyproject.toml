[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "irtrixai-cli"
version = "0.1.0"
description = "IrtrixAI Autonomous Coding Assistant - CLI Client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
irtrixai = "irtrixai_cli.main:app"