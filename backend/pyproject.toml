[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "irtrixai-backend"
version = "0.1.0"
description = "IrtrixAI Coding Assistant Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.1.19,<4.0.0",
    "psycopg-pool>=3.2.0,<4.0.0",
    "docker>=7.0.0,<8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "anyio>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "scripts*", "alembic*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Line length in tests and docstrings
    "B008",  # Depends in FastAPI parameters
    "B017",  # Blind exception assertions in tests
    "C901",  # Function complexity
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Fast unit tests running without external services",
    "integration: Integration tests requiring external infrastructure",
    "postgres: Integration tests requiring a real PostgreSQL 16 database",
    "concurrency: Real race-condition tests validating PostgreSQL row-locks",
    "multiworker: Multi-process backend worker smoke tests",
    "docker: Real Docker sandbox security and isolation tests",
    "security: Authoritative security boundary validation tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
