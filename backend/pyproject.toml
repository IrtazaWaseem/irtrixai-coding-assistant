[project]
name = "irtrixai-backend"
version = "0.1.0"
description = "IrtrixAI Coding Assistant Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.1.18",
    "alembic>=1.13.1",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.1",
    "groq>=0.5.0",
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.2",
    "anyio>=4.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Fast unit tests running without external services",
    "integration: Integration tests requiring external infrastructure",
    "postgres: Integration tests requiring a real PostgreSQL 16 database",
    "concurrency: Real race-condition tests validating PostgreSQL row-locks",
    "multiworker: Multi-process backend worker smoke tests",
    "docker: Real Docker sandbox security and isolation tests",
    "security: Authoritative security boundary validation tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Line length in tests and docstrings
    "B008",  # Depends in FastAPI parameters
    "B017",  # Blind exception assertions in tests
    "C901",  # Function complexity
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true